<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afifa Birthday Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button class="theme-btn" onclick="toggleTheme()">
        ◐ CHANGE THEME
    </button>

    <main class="container">
        <div class="card">

            <div class="coming-soon">
                <span></span>
                COMING SOON
                <span></span>
            </div>

            <p class="top-text">✦ A SPECIAL DAY IS COMING ✦</p>

            <h1>HAPPY BIRTHDAY</h1>

            <h2>AFIFA FAUZAH YASSER</h2>

            <p class="subtitle">
                Get ready for your special day!
            </p>

            <div class="birthday-icon">🎀</div>

            <div id="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <small>DAYS</small>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>HOURS</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>MINUTES</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>SECONDS</small>
                </div>
            </div>

            <h3 id="date">13 NOVEMBER 2026</h3>

            <div id="finished" class="hidden">
                <h2 class="birthday-title">IT'S YOUR BIRTHDAY!</h2>

                <p class="subtitle">
                    The wait is finally over!
                </p>

                <button id="surpriseBtn" onclick="showSurprise()">
                    ???
                </button>

                <h3 id="message" class="hidden">
                    HBD oi, salam dari Fatih guru FF mu anjay slebeww
                </h3>
            </div>

            <p class="footer">MADE WITH ♥ BY FATIH</p>

        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
